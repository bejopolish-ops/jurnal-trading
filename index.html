<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jurnal Trading Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="pb-10">

  <!-- Header Telegram Mini App -->
  <header class="glass sticky top-0 z-50 px-4 py-3 shadow-md flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg">
        <i class="fa-solid fa-chart-line text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight">Jurnal Trading</h1>
        <p class="text-xs text-slate-400" id="userGreeting">Telegram Mini App</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center transition">
        <i class="fa-solid fa-plus mr-1"></i> Input Trade
      </button>
    </div>
  </header>

  <main class="p-4 space-y-4 max-w-2xl mx-auto">
    <!-- Stat Metrics -->
    <div class="grid grid-cols-2 gap-3">
      <div class="glass p-3 rounded-xl">
        <span class="text-xs text-slate-400 font-medium">Total Net PnL</span>
        <div class="text-xl font-extrabold mt-1" id="statNetPnL">$0.00</div>
        <span class="text-[10px] text-slate-500" id="statTradeCount">0 Trades</span>
      </div>
      <div class="glass p-3 rounded-xl">
        <span class="text-xs text-slate-400 font-medium">Win Rate</span>
        <div class="text-xl font-extrabold text-emerald-400 mt-1" id="statWinRate">0%</div>
        <div class="text-[10px] text-slate-400 flex justify-between mt-1">
          <span class="text-emerald-400" id="statWins">W: 0</span>
          <span class="text-rose-400" id="statLosses">L: 0</span>
        </div>
      </div>
    </div>

    <!-- Chart -->
    <div class="glass p-4 rounded-xl">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Equity Curve</h3>
      <div class="h-44 w-full">
        <canvas id="equityChart"></canvas>
      </div>
    </div>

    <!-- Trade List -->
    <div class="glass p-4 rounded-xl space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-slate-200">Riwayat Trading</h3>
        <button onclick="clearAllTrades()" class="text-xs text-rose-400 hover:text-rose-300">Reset Data</button>
      </div>
      <div id="tradeList" class="space-y-2">
        <!-- Dynamic content -->
      </div>
    </div>
  </main>

  <!-- Modal Input Trade -->
  <div id="tradeModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="glass bg-slate-900 rounded-2xl w-full max-w-md p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-base text-slate-100">Tambah Catatan Trade</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <form id="tradeForm" onsubmit="saveTrade(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 block mb-1">Pair / Instrument</label>
            <input type="text" id="pair" required placeholder="XAUUSD, BTCUSDT..." class="w-full bg-slate-800 rounded-lg p-2.5 text-slate-100 border border-slate-700 focus:outline-none focus:border-indigo-500 uppercase">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Posisi</label>
            <select id="type" class="w-full bg-slate-800 rounded-lg p-2.5 text-slate-100 border border-slate-700 focus:outline-none focus:border-indigo-500">
              <option value="LONG">LONG (BUY)</option>
              <option value="SHORT">SHORT (SELL)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 block mb-1">Entry Price</label>
            <input type="number" step="any" id="entry" required placeholder="2000.50" class="w-full bg-slate-800 rounded-lg p-2.5 text-slate-100 border border-slate-700 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Exit Price</label>
            <input type="number" step="any" id="exit" required placeholder="2010.00" class="w-full bg-slate-800 rounded-lg p-2.5 text-slate-100 border border-slate-700 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 block mb-1">Profit/Loss ($ / Rp)</label>
            <input type="number" step="any" id="pnl" required placeholder="+150 atau -50" class="w-full bg-slate-800 rounded-lg p-2.5 text-slate-100 border border-slate-700 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Strategi / Setup</label>
            <input type="text" id="strategy" placeholder="ICT / Breakout / SMC" class="w-full bg-slate-800 rounded-lg p-2.5 text-slate-100 border border-slate-700 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="text-slate-400 block mb-1">Catatan & Evaluasi</label>
          <textarea id="notes" rows="2" placeholder="Sesuai plan, tidak emosi..." class="w-full bg-slate-800 rounded-lg p-2.5 text-slate-100 border border-slate-700 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-xl transition shadow-lg mt-2">
          Simpan Trade
        </button>
      </form>
    </div>
  </div>

  <script>
    // Init Telegram WebApp
    let tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('userGreeting').innerText = '@' + tg.initDataUnsafe.user.username;
      }
    }

    let trades = JSON.parse(localStorage.getItem('trading_journal_data')) || [];

    function saveTrade(e) {
      e.preventDefault();
      const newTrade = {
        id: Date.now(),
        date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }),
        pair: document.getElementById('pair').value.toUpperCase(),
        type: document.getElementById('type').value,
        entry: document.getElementById('entry').value,
        exit: document.getElementById('exit').value,
        pnl: parseFloat(document.getElementById('pnl').value),
        strategy: document.getElementById('strategy').value || 'Default',
        notes: document.getElementById('notes').value
      };

      trades.unshift(newTrade);
      localStorage.setItem('trading_journal_data', JSON.stringify(trades));
      closeModal();
      document.getElementById('tradeForm').reset();
      updateUI();
    }

    function deleteTrade(id) {
      if(confirm('Hapus jurnal ini?')) {
        trades = trades.filter(t => t.id !== id);
        localStorage.setItem('trading_journal_data', JSON.stringify(trades));
        updateUI();
      }
    }

    function clearAllTrades() {
      if(confirm('Hapus semua riwayat trading?')) {
        trades = [];
        localStorage.removeItem('trading_journal_data');
        updateUI();
      }
    }

    function openModal() { document.getElementById('tradeModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('tradeModal').classList.add('hidden'); }

    let chartInstance = null;
    function renderChart() {
      const ctx = document.getElementById('equityChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      let cumulativePnL = 0;
      const reversedTrades = [...trades].reverse();
      const labels = reversedTrades.map(t => t.date);
      const dataPoints = reversedTrades.map(t => {
        cumulativePnL += t.pnl;
        return cumulativePnL;
      });

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['Start'],
          datasets: [{
            label: 'Equity ($)',
            data: dataPoints.length ? dataPoints : [0],
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99, 102, 241, 0.15)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
          }
        }
      });
    }

    function updateUI() {
      const listContainer = document.getElementById('tradeList');
      listContainer.innerHTML = '';

      let totalPnL = 0;
      let wins = 0;
      let losses = 0;

      if (trades.length === 0) {
        listContainer.innerHTML = '<p class="text-center text-xs text-slate-500 py-6">Belum ada catatan trading. Klik "Input Trade" untuk memulai.</p>';
      } else {
        trades.forEach(t => {
          totalPnL += t.pnl;
          if (t.pnl > 0) wins++;
          else if (t.pnl < 0) losses++;

          const isWin = t.pnl >= 0;
          const card = document.createElement('div');
          card.className = 'glass-card p-3 rounded-lg flex justify-between items-center text-xs';
          card.innerHTML = `
            <div>
              <div class="flex items-center space-x-2">
                <span class="font-bold text-slate-100">${t.pair}</span>
                <span class="${t.type === 'LONG' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'} text-[10px] px-1.5 py-0.5 rounded font-semibold">${t.type}</span>
                <span class="text-[10px] text-slate-500">${t.date}</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-1">E: ${t.entry} | X: ${t.exit} (${t.strategy})</p>
            </div>
            <div class="text-right">
              <span class="font-bold text-sm ${isWin ? 'text-emerald-400' : 'text-rose-400'}">${isWin ? '+' : ''}${t.pnl}</span>
              <button onclick="deleteTrade(${t.id})" class="block ml-auto mt-1 text-[10px] text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
          listContainer.appendChild(card);
        });
      }

      document.getElementById('statNetPnL').innerText = (totalPnL >= 0 ? '+' : '') + '$' + totalPnL.toFixed(2);
      document.getElementById('statNetPnL').className = 'text-xl font-extrabold mt-1 ' + (totalPnL >= 0 ? 'text-emerald-400' : 'text-rose-400');
      document.getElementById('statTradeCount').innerText = trades.length + ' Trades';
      
      const totalClosed = wins + losses;
      const winRate = totalClosed > 0 ? Math.round((wins / totalClosed) * 100) : 0;
      document.getElementById('statWinRate').innerText = winRate + '%';
      document.getElementById('statWins').innerText = 'W: ' + wins;
      document.getElementById('statLosses').innerText = 'L: ' + losses;

      renderChart();
    }

    updateUI();
  </script>
</body>
</html>
