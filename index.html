<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jurnal Trading Cent Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
    .glass-card { background: rgba(20, 30, 50, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); }
    .glow-gold { box-shadow: 0 0 20px rgba(245, 158, 11, 0.25); }
    .glow-indigo { box-shadow: 0 0 20px rgba(99, 102, 241, 0.25); }
    
    /* Bottom Sheet Animation */
    .sheet-backdrop { transition: opacity 0.25s ease-in-out; }
    .sheet-content { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .sheet-backdrop.hidden-sheet { opacity: 0; pointer-events: none; }
    .sheet-backdrop.hidden-sheet .sheet-content { transform: translateY(100%); }

    ::-webkit-scrollbar { width: 0px; height: 0px; } /* Hide scrollbar for native app feel */
  </style>
</head>
<body class="pb-24 pt-2">

  <!-- Header Ringkas -->
  <header class="px-4 py-2 flex justify-between items-center max-w-2xl mx-auto">
    <div class="flex items-center space-x-2.5">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center font-bold text-slate-950 shadow-lg glow-gold">
        <i class="fa-solid fa-coins text-lg"></i>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="text-sm font-extrabold text-white tracking-wide">Bejo ent.</h1>
          <span id="rankBadge" class="bg-amber-500/20 text-amber-400 text-[10px] px-2 py-0.5 rounded-full font-semibold border border-amber-500/30">🐣 Novice</span>
        </div>
        <p class="text-[11px] text-slate-400" id="userGreeting">Akun Cent (USC ¢)</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-1.5">
      <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs p-2 rounded-xl border border-slate-700 transition">
        <i class="fa-solid fa-file-csv text-emerald-400"></i>
      </button>
      <button onclick="clearAllData()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 text-xs p-2 rounded-xl border border-slate-700 transition">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
    </div>
  </header>

  <main class="p-4 space-y-4 max-w-2xl mx-auto">

    <!-- Quote Motivasi -->
    <div class="glass p-3 rounded-2xl border-l-4 border-amber-500 flex justify-between items-center text-xs text-slate-300">
      <div class="flex items-center space-x-2.5 overflow-hidden">
        <i class="fa-solid fa-quote-left text-amber-400 text-sm flex-shrink-0"></i>
        <p id="dailyQuote" class="italic truncate">"Plan the trade and trade the plan."</p>
      </div>
      <button onclick="nextQuote()" class="text-slate-400 hover:text-white ml-2 flex-shrink-0"><i class="fa-solid fa-rotate-right"></i></button>
    </div>

    <!-- Target Goal Progress Card -->
    <div class="glass p-4 rounded-2xl space-y-2.5 relative overflow-hidden">
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-bullseye text-amber-400 text-xs"></i>
          <span class="text-xs font-bold text-slate-300">Target Profit (Goal)</span>
        </div>
        <button onclick="editGoal()" class="text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-lg border border-amber-500/20">
          Set Target <i class="fa-solid fa-pen text-[8px] ml-0.5"></i>
        </button>
      </div>
      
      <div class="flex justify-between items-end">
        <div>
          <span class="text-xs text-slate-400">Pencapaian: </span>
          <span id="goalProgressText" class="text-sm font-extrabold text-white">¢0 / ¢10.000</span>
        </div>
        <span id="goalPercentText" class="text-xs font-black text-amber-400">0%</span>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
        <div id="goalProgressBar" class="bg-gradient-to-r from-amber-500 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>

    <!-- Metric Cards Grid -->
    <div class="grid grid-cols-2 gap-3">
      <!-- Total Saldo Cent -->
      <div class="glass p-3.5 rounded-2xl">
        <div class="text-[11px] text-slate-400 font-medium">Total Saldo (Cent)</div>
        <div class="text-2xl font-black mt-1 tracking-tight text-amber-400" id="statBalance">¢0.00</div>
        <div class="flex justify-between text-[10px] text-slate-400 mt-2 border-t border-slate-800/80 pt-1.5">
          <span>Depo: <strong id="statDepo" class="text-emerald-400">¢0</strong></span>
          <span>WD: <strong id="statWD" class="text-rose-400">¢0</strong></span>
        </div>
      </div>

      <!-- Net PnL & Win Rate -->
      <div class="glass p-3.5 rounded-2xl">
        <div class="flex justify-between items-center">
          <span class="text-[11px] text-slate-400 font-medium">Net PnL</span>
          <span id="winStreakBadge" class="text-[10px] bg-amber-500/20 text-amber-400 px-1.5 py-0.5 rounded font-bold">🔥 0 Streak</span>
        </div>
        <div class="text-2xl font-black mt-1 tracking-tight" id="statNetPnL">¢0.00</div>
        <div class="flex justify-between text-[10px] text-slate-400 mt-2 border-t border-slate-800/80 pt-1.5">
          <span>WR: <strong id="statWinRate" class="text-emerald-400">0%</strong></span>
          <span id="statWinLoss">W: 0 / L: 0</span>
        </div>
      </div>
    </div>

    <!-- Equity Curve Chart -->
    <div class="glass p-4 rounded-2xl space-y-2">
      <div class="flex justify-between items-center">
        <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Grafik Pertumbuhan Saldo</h3>
        <span class="text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/20">Real-time</span>
      </div>
      <div class="h-40 w-full">
        <canvas id="equityChart"></canvas>
      </div>
    </div>

    <!-- Content Tabs & Filters -->
    <div class="glass p-4 rounded-2xl space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <div class="flex space-x-3 text-xs font-bold">
          <button onclick="switchTab('trades')" id="tabTradesBtn" class="text-amber-400 border-b-2 border-amber-500 pb-2 px-1">Riwayat Trade</button>
          <button onclick="switchTab('trans')" id="tabTransBtn" class="text-slate-400 hover:text-slate-200 pb-2 px-1">Depo & WD</button>
        </div>
      </div>

      <!-- Content Trades -->
      <div id="tabTradesContent" class="space-y-2">
        <div class="flex gap-1.5 text-[10px]">
          <button onclick="filterTrades('ALL')" id="filterAll" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg font-semibold">Semua</button>
          <button onclick="filterTrades('WIN')" id="filterWin" class="bg-slate-800 text-slate-400 px-2.5 py-1 rounded-lg font-semibold">Win</button>
          <button onclick="filterTrades('LOSS')" id="filterLoss" class="bg-slate-800 text-slate-400 px-2.5 py-1 rounded-lg font-semibold">Loss</button>
        </div>
        <div id="tradeList" class="space-y-2 pt-1"></div>
      </div>

      <!-- Content Transactions -->
      <div id="tabTransContent" class="space-y-2 hidden">
        <div id="transList" class="space-y-2 pt-1"></div>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR (Mobile First) -->
  <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800 px-4 py-2 z-40">
    <div class="max-w-2xl mx-auto flex justify-around items-center">
      <button onclick="window.scrollTo({top: 0, behavior: 'smooth'}); triggerHaptic();" class="flex flex-col items-center text-amber-400">
        <i class="fa-solid fa-chart-pie text-base"></i>
        <span class="text-[10px] mt-1 font-semibold">Home</span>
      </button>

      <button onclick="openModal('depoModal')" class="flex flex-col items-center text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-wallet text-base"></i>
        <span class="text-[10px] mt-1 font-semibold">Depo/WD</span>
      </button>

      <!-- Floating Main Action Button -->
      <button onclick="openModal('tradeModal')" class="bg-gradient-to-tr from-amber-500 to-amber-400 text-slate-950 w-12 h-12 rounded-full flex items-center justify-center text-lg font-black shadow-lg glow-gold -mt-5 border-2 border-slate-900 transition active:scale-95">
        <i class="fa-solid fa-plus"></i>
      </button>

      <button onclick="switchTab('trades'); triggerHaptic();" class="flex flex-col items-center text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-list-check text-base"></i>
        <span class="text-[10px] mt-1 font-semibold">Jurnal</span>
      </button>

      <button onclick="exportCSV(); triggerHaptic();" class="flex flex-col items-center text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-download text-base"></i>
        <span class="text-[10px] mt-1 font-semibold">Export</span>
      </button>
    </div>
  </nav>

  <!-- BOTTOM SHEET MODAL: Catat Trade -->
  <div id="tradeModal" class="sheet-backdrop hidden-sheet fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center">
    <div class="sheet-content glass bg-slate-900 w-full max-w-2xl rounded-t-3xl p-5 space-y-4 border-t border-slate-700 max-h-[85vh] overflow-y-auto">
      <!-- Drag Handle -->
      <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto -mt-1 mb-2"></div>
      
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-sm text-slate-100 flex items-center"><i class="fa-solid fa-pen-to-square text-amber-400 mr-2"></i> Catat Trade Cent</h3>
        <button onclick="closeModal('tradeModal')" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="tradeForm" onsubmit="saveTrade(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 block mb-1">Pair / Market</label>
            <select id="pair" required class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500">
              <option value="XAUUSD">XAUUSD (GOLD)</option>
              <option value="BTCUSDT">BTCUSDT</option>
            </select>
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Posisi</label>
            <select id="type" class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500">
              <option value="LONG">LONG (BUY)</option>
              <option value="SHORT">SHORT (SELL)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 block mb-1">Entry Price</label>
            <input type="number" step="any" id="entry" required placeholder="2000.50" class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Exit Price</label>
            <input type="number" step="any" id="exit" required placeholder="2010.00" class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 block mb-1">Profit/Loss (¢ Cent)</label>
            <input type="number" step="any" id="pnl" required placeholder="+1500 atau -500" class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Mood / Emosi</label>
            <select id="mood" class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500">
              <option value="🧘 Disiplin">🧘 Disiplin (Sesuai Plan)</option>
              <option value="🚀 Confident">🚀 Confident</option>
              <option value="⚡ FOMO">⚡ FOMO</option>
              <option value="🤬 Revenge">🤬 Revenge Trade</option>
              <option value="😰 Ragu">😰 Ragu / Takut</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-slate-400 block mb-1">Catatan & Strategi</label>
          <textarea id="notes" rows="2" placeholder="Breakout H1, Sesuai Plan..." class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold p-3.5 rounded-xl transition shadow-lg glow-gold mt-2">
          Simpan Trade (Cent)
        </button>
      </form>
    </div>
  </div>

  <!-- BOTTOM SHEET MODAL: Depo / WD -->
  <div id="depoModal" class="sheet-backdrop hidden-sheet fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center">
    <div class="sheet-content glass bg-slate-900 w-full max-w-2xl rounded-t-3xl p-5 space-y-4 border-t border-slate-700">
      <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto -mt-1 mb-2"></div>

      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-sm text-slate-100 flex items-center"><i class="fa-solid fa-wallet text-emerald-400 mr-2"></i> Input Deposit / WD (Cent)</h3>
        <button onclick="closeModal('depoModal')" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="depoForm" onsubmit="saveTransaction(event)" class="space-y-3 text-xs">
        <div>
          <label class="text-slate-400 block mb-1">Tipe Transaksi</label>
          <select id="transType" class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500">
            <option value="DEPOSIT">DEPOSIT (+)</option>
            <option value="WITHDRAW">WITHDRAW (-)</option>
          </select>
        </div>

        <div>
          <label class="text-slate-400 block mb-1">Nominal Cent (¢)</label>
          <input type="number" step="any" id="transAmount" required placeholder="Contoh: 10000 untuk 10.000¢" class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="text-slate-400 block mb-1">Keterangan / Catatan</label>
          <input type="text" id="transNotes" placeholder="Deposit awal akun cent, WD Profit..." class="w-full bg-slate-800 rounded-xl p-3 text-slate-100 border border-slate-700 focus:outline-none focus:border-amber-500">
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3.5 rounded-xl transition shadow-lg mt-2">
          Simpan Transaksi
        </button>
      </form>
    </div>
  </div>

  <script>
    // Telegram WebApp Setup & Haptic Feedback Helper
    let tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('userGreeting').innerText = '@' + tg.initDataUnsafe.user.username + ' • Akun Cent';
      }
    }

    function triggerHaptic(type = 'light') {
      if (tg && tg.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('warning');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    // State Data
    let trades = JSON.parse(localStorage.getItem('tj_trades_cent')) || [];
    let transactions = JSON.parse(localStorage.getItem('tj_trans_cent')) || [];
    let targetGoal = JSON.parse(localStorage.getItem('tj_goal_cent')) || 10000; // Default goal 10,000¢
    let activeFilter = 'ALL';

    const quotes = [
      "\"Risk comes from not knowing what you are doing.\" — Warren Buffett",
      "\"Plan the trade and trade the plan.\"",
      "\"Losses are necessary errors that teach us what not to do.\"",
      "\"The goal of a successful trader is to make the best trades. Money is secondary.\""
    ];
    let quoteIdx = 0;
    function nextQuote() {
      triggerHaptic();
      quoteIdx = (quoteIdx + 1) % quotes.length;
      document.getElementById('dailyQuote').innerText = quotes[quoteIdx];
    }

    function editGoal() {
      triggerHaptic();
      let newGoal = prompt('Masukkan target profit bersih kamu (dalam Cent / ¢):', targetGoal);
      if (newGoal && !isNaN(newGoal)) {
        targetGoal = parseFloat(newGoal);
        localStorage.setItem('tj_goal_cent', JSON.stringify(targetGoal));
        updateUI();
      }
    }

    function formatMoney(val) {
      return (val >= 0 ? '+' : '') + '¢' + val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function saveTrade(e) {
      e.preventDefault();
      const pnlVal = parseFloat(document.getElementById('pnl').value);
      const newTrade = {
        id: Date.now(),
        date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
        pair: document.getElementById('pair').value,
        type: document.getElementById('type').value,
        entry: document.getElementById('entry').value,
        exit: document.getElementById('exit').value,
        pnl: pnlVal,
        mood: document.getElementById('mood').value,
        notes: document.getElementById('notes').value
      };

      trades.unshift(newTrade);
      localStorage.setItem('tj_trades_cent', JSON.stringify(trades));
      closeModal('tradeModal');
      document.getElementById('tradeForm').reset();

      if (pnlVal > 0) {
        triggerHaptic('success');
        confetti({ particleCount: 80, spread: 60, origin: { y: 0.8 } });
      } else {
        triggerHaptic('error');
      }

      updateUI();
    }

    function saveTransaction(e) {
      e.preventDefault();
      triggerHaptic('success');
      const type = document.getElementById('transType').value;
      const amount = Math.abs(parseFloat(document.getElementById('transAmount').value));
      const newTrans = {
        id: Date.now(),
        date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }),
        type: type,
        amount: amount,
        notes: document.getElementById('transNotes').value || '-'
      };

      transactions.unshift(newTrans);
      localStorage.setItem('tj_trans_cent', JSON.stringify(transactions));
      closeModal('depoModal');
      document.getElementById('depoForm').reset();
      updateUI();
    }

    function deleteTrade(id) {
      triggerHaptic();
      if(confirm('Hapus catatan trade ini?')) {
        trades = trades.filter(t => t.id !== id);
        localStorage.setItem('tj_trades_cent', JSON.stringify(trades));
        updateUI();
      }
    }

    function deleteTrans(id) {
      triggerHaptic();
      if(confirm('Hapus riwayat transaksi ini?')) {
        transactions = transactions.filter(t => t.id !== id);
        localStorage.setItem('tj_trans_cent', JSON.stringify(transactions));
        updateUI();
      }
    }

    function clearAllData() {
      triggerHaptic('error');
      if(confirm('Hapus seluruh riwayat trade & transaksi?')) {
        trades = [];
        transactions = [];
        localStorage.removeItem('tj_trades_cent');
        localStorage.removeItem('tj_trans_cent');
        updateUI();
      }
    }

    function openModal(id) {
      triggerHaptic();
      document.getElementById(id).classList.remove('hidden-sheet');
    }

    function closeModal(id) {
      triggerHaptic();
      document.getElementById(id).classList.add('hidden-sheet');
    }

    function switchTab(tab) {
      if (tab === 'trades') {
        document.getElementById('tabTradesContent').classList.remove('hidden');
        document.getElementById('tabTransContent').classList.add('hidden');
        document.getElementById('tabTradesBtn').className = 'text-amber-400 border-b-2 border-amber-500 pb-2 px-1';
        document.getElementById('tabTransBtn').className = 'text-slate-400 hover:text-slate-200 pb-2 px-1';
      } else {
        document.getElementById('tabTradesContent').classList.add('hidden');
        document.getElementById('tabTransContent').classList.remove('hidden');
        document.getElementById('tabTransBtn').className = 'text-amber-400 border-b-2 border-amber-500 pb-2 px-1';
        document.getElementById('tabTradesBtn').className = 'text-slate-400 hover:text-slate-200 pb-2 px-1';
      }
    }

    function filterTrades(type) {
      triggerHaptic();
      activeFilter = type;
      ['All', 'Win', 'Loss'].forEach(f => {
        const btn = document.getElementById('filter' + f);
        if (f.toUpperCase() === type) {
          btn.className = 'bg-indigo-600 text-white px-2.5 py-1 rounded-lg font-semibold';
        } else {
          btn.className = 'bg-slate-800 text-slate-400 px-2.5 py-1 rounded-lg font-semibold';
        }
      });
      renderTradeList();
    }

    let chartInstance = null;
    function renderChart() {
      const ctx = document.getElementById('equityChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      let currentBal = 0;
      let dataPoints = [];
      let labels = [];

      let combinedEvents = [
        ...transactions.map(t => ({ date: t.date, val: t.type === 'DEPOSIT' ? t.amount : -t.amount, id: t.id })),
        ...trades.map(t => ({ date: t.date, val: t.pnl, id: t.id }))
      ].sort((a,b) => a.id - b.id);

      combinedEvents.forEach(e => {
        currentBal += e.val;
        dataPoints.push(currentBal);
        labels.push(e.date);
      });

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['Start'],
          datasets: [{
            label: 'Saldo Cent (¢)',
            data: dataPoints.length ? dataPoints : [0],
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245, 158, 11, 0.12)',
            fill: true,
            tension: 0.3,
            pointRadius: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b', font: { size: 9 } } },
            y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b', font: { size: 9 } } }
          }
        }
      });
    }

    function renderTradeList() {
      const container = document.getElementById('tradeList');
      container.innerHTML = '';

      let filtered = trades;
      if (activeFilter === 'WIN') filtered = trades.filter(t => t.pnl > 0);
      if (activeFilter === 'LOSS') filtered = trades.filter(t => t.pnl < 0);

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-center text-xs text-slate-500 py-6">Belum ada catatan trade.</p>';
        return;
      }

      filtered.forEach(t => {
        const isWin = t.pnl >= 0;
        const card = document.createElement('div');
        card.className = 'glass-card p-3 rounded-xl flex justify-between items-center text-xs border-l-2 ' + (isWin ? 'border-l-emerald-400' : 'border-l-rose-400');
        card.innerHTML = `
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-slate-100">${t.pair}</span>
              <span class="${t.type === 'LONG' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'} text-[10px] px-1.5 py-0.2 rounded font-semibold">${t.type}</span>
              <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.2 rounded">${t.mood || '🧘 Disiplin'}</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-1">Entry: ${t.entry} | Exit: ${t.exit} ${t.notes ? '| ' + t.notes : ''}</p>
            <span class="text-[9px] text-slate-500">${t.date}</span>
          </div>
          <div class="text-right">
            <span class="font-bold text-sm ${isWin ? 'text-emerald-400' : 'text-rose-400'}">${formatMoney(t.pnl)}</span>
            <button onclick="deleteTrade(${t.id})" class="block ml-auto mt-1 text-[10px] text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderTransList() {
      const container = document.getElementById('transList');
      container.innerHTML = '';

      if (transactions.length === 0) {
        container.innerHTML = '<p class="text-center text-xs text-slate-500 py-6">Belum ada riwayat Deposit/WD.</p>';
        return;
      }

      transactions.forEach(t => {
        const isDepo = t.type === 'DEPOSIT';
        const card = document.createElement('div');
        card.className = 'glass-card p-3 rounded-xl flex justify-between items-center text-xs border-l-2 ' + (isDepo ? 'border-l-emerald-400' : 'border-l-rose-400');
        card.innerHTML = `
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-bold ${isDepo ? 'text-emerald-400' : 'text-rose-400'}">${t.type}</span>
              <span class="text-[10px] text-slate-400">${t.notes}</span>
            </div>
            <span class="text-[9px] text-slate-500">${t.date}</span>
          </div>
          <div class="text-right">
            <span class="font-bold text-sm ${isDepo ? 'text-emerald-400' : 'text-rose-400'}">${isDepo ? '+' : '-'}¢${t.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
            <button onclick="deleteTrans(${t.id})" class="block ml-auto mt-1 text-[10px] text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function exportCSV() {
      if (trades.length === 0) { alert('Belum ada data untuk di-export.'); return; }
      let csv = 'ID,Tanggal,Pair,Posisi,Entry,Exit,PnL_Cent,Mood,Catatan\n';
      trades.forEach(t => {
        csv += `"${t.id}","${t.date}","${t.pair}","${t.type}","${t.entry}","${t.exit}","${t.pnl}","${t.mood || ''}","${t.notes || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'Jurnal_Trading_Cent_' + new Date().toISOString().slice(0,10) + '.csv');
      a.click();
    }

    function updateUI() {
      // Stats Calculation
      let totalDepo = transactions.filter(t => t.type === 'DEPOSIT').reduce((acc, t) => acc + t.amount, 0);
      let totalWD = transactions.filter(t => t.type === 'WITHDRAW').reduce((acc, t) => acc + t.amount, 0);
      let totalPnL = trades.reduce((acc, t) => acc + t.pnl, 0);
      let totalBalance = totalDepo - totalWD + totalPnL;

      let wins = trades.filter(t => t.pnl > 0).length;
      let losses = trades.filter(t => t.pnl < 0).length;
      let totalClosed = wins + losses;
      let winRate = totalClosed > 0 ? Math.round((wins / totalClosed) * 100) : 0;

      // Win Streak Calculation
      let streak = 0;
      for (let t of trades) {
        if (t.pnl > 0) streak++;
        else break;
      }

      // Target Goal Calculation
      let pct = targetGoal > 0 ? Math.min(100, Math.max(0, Math.round((totalPnL / targetGoal) * 100))) : 0;
      document.getElementById('goalProgressText').innerText = '¢' + totalPnL.toLocaleString('en-US') + ' / ¢' + targetGoal.toLocaleString('en-US');
      document.getElementById('goalPercentText').innerText = pct + '%';
      document.getElementById('goalProgressBar').style.width = pct + '%';

      // Rank Badging
      const count = trades.length;
      let rank = '🐣 Novice';
      if (count > 5) rank = '🛡️ Trader';
      if (count > 15) rank = '⚡ Pro Trader';
      if (count > 30) rank = '👑 Master';
      if (count > 50) rank = '🪐 Legend';

      document.getElementById('rankBadge').innerText = rank;
      document.getElementById('statBalance').innerText = '¢' + totalBalance.toLocaleString('en-US', { minimumFractionDigits: 2 });
      document.getElementById('statDepo').innerText = '¢' + totalDepo.toLocaleString('en-US', { minimumFractionDigits: 0 });
      document.getElementById('statWD').innerText = '¢' + totalWD.toLocaleString('en-US', { minimumFractionDigits: 0 });

      document.getElementById('statNetPnL').innerText = formatMoney(totalPnL);
      document.getElementById('statNetPnL').className = 'text-2xl font-black mt-1 tracking-tight ' + (totalPnL >= 0 ? 'text-emerald-400' : 'text-rose-400');
      document.getElementById('statWinRate').innerText = winRate + '%';
      document.getElementById('statWinLoss').innerText = 'W: ' + wins + ' / L: ' + losses;
      document.getElementById('winStreakBadge').innerText = '🔥 ' + streak + ' Streak';

      renderTradeList();
      renderTransList();
      renderChart();
    }

    // Initial Load
    updateUI();
  </script>
</body>
</html>
